<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Shield icon -->
    <path d="M10 8 L42 14 V42 C42 64 28 80 10 84 C-8 80 -22 64 -22 42 V14 Z" fill="url(#shieldGrad)" transform="translate(50,0)"/>
    <text x="50" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">RC</text>
    <path d="M30 60 L34 54 H66 L70 60 L76 60 V68 L70 68 L64 62 H36 L30 68 L24 68 V60 Z" fill="#ffffff" transform="translate(50,0)"/>
  </g>

  <!-- Text -->
  <text x="90" y="45" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="url(#textGrad)" letter-spacing="0.5">RamsCars Dealership</text>
  <text x="90" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">Inspected, Transparent and Trusted</text>
</svg>
